<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <clipPath id="round"><rect width="192" height="192" rx="42"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="192" height="192" fill="url(#bg)"/>
    <!-- Crescent Moon -->
    <circle cx="96" cy="52" r="26" fill="#C89B3C"/>
    <circle cx="105" cy="45" r="22" fill="#1E3A8A"/>
    <!-- Small star -->
    <polygon points="138,34 140,40 147,40 141,44 143,51 138,47 133,51 135,44 129,40 136,40" fill="#C89B3C"/>
    <!-- Mosque Dome -->
    <ellipse cx="96" cy="104" rx="42" ry="32" fill="none" stroke="#C89B3C" stroke-width="3.5"/>
    <path d="M54,104 Q54,72 96,68 Q138,72 138,104" fill="rgba(200,155,60,0.15)" stroke="#C89B3C" stroke-width="3.5"/>
    <!-- Dome finial -->
    <rect x="93" y="62" width="6" height="10" rx="2" fill="#C89B3C"/>
    <circle cx="96" cy="60" r="4" fill="#C89B3C"/>
    <!-- Minaret Left -->
    <rect x="32" y="82" width="10" height="52" rx="2" fill="rgba(200,155,60,0.25)" stroke="#C89B3C" stroke-width="1.5"/>
    <ellipse cx="37" cy="80" rx="7" ry="8" fill="rgba(200,155,60,0.25)" stroke="#C89B3C" stroke-width="1.5"/>
    <!-- Minaret Right -->
    <rect x="150" y="82" width="10" height="52" rx="2" fill="rgba(200,155,60,0.25)" stroke="#C89B3C" stroke-width="1.5"/>
    <ellipse cx="155" cy="80" rx="7" ry="8" fill="rgba(200,155,60,0.25)" stroke="#C89B3C" stroke-width="1.5"/>
    <!-- Base / Wall -->
    <rect x="24" y="138" width="144" height="8" rx="2" fill="#C89B3C" opacity="0.6"/>
    <!-- Open Book -->
    <g transform="translate(96,158)">
      <!-- Left page -->
      <path d="M-32,-8 Q-16,-14 0,-6 L0,8 Q-16,2 -32,8 Z" fill="rgba(255,255,255,0.9)" stroke="#C89B3C" stroke-width="1.5"/>
      <!-- Right page -->
      <path d="M0,-6 Q16,-14 32,-8 L32,8 Q16,2 0,8 Z" fill="rgba(255,255,255,0.9)" stroke="#C89B3C" stroke-width="1.5"/>
      <!-- Spine -->
      <line x1="0" y1="-6" x2="0" y2="8" stroke="#C89B3C" stroke-width="2"/>
      <!-- Page lines left -->
      <line x1="-26" y1="-2" x2="-8" y2="-4" stroke="rgba(0,73,54,0.4)" stroke-width="1"/>
      <line x1="-26" y1="2" x2="-8" y2="0" stroke="rgba(0,73,54,0.4)" stroke-width="1"/>
      <!-- Page lines right -->
      <line x1="8" y1="-4" x2="26" y2="-2" stroke="rgba(0,73,54,0.4)" stroke-width="1"/>
      <line x1="8" y1="0" x2="26" y2="2" stroke="rgba(0,73,54,0.4)" stroke-width="1"/>
    </g>
  </g>
</svg>
